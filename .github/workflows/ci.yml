name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Um push novo na mesma branch cancela a execução anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificacao:
    name: Lint e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          # Piso declarado em package.json (engines.node).
          node-version: "22"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Scripts de raiz delegam a cada workspace (--workspaces --if-present).
      - name: Lint
        run: npm run lint

      # `npm test` builda e testa cada workspace. Em apps/site, a suíte importa
      # o worker compilado em dist/ e verifica o HTML realmente renderizado.
      - name: Testes
        run: npm test
